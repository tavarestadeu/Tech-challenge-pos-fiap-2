services:
  mysql-db:
    image: mysql:8.0
    container_name: gestao_restaurantes_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tech-challenge-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tech_challenge_api
    restart: always
    ports:
      - "8082:8080"
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - tech-challenge-net

volumes:
  mysql_data:

networks:
  tech-challenge-net:
    driver: bridge